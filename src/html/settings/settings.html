<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<title class="top-title" data-translation="optionsTitle">Seek 'n Play options</title>
		<link href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&amp;subset=latin" rel="stylesheet"/>
		<link href="css/options.css" rel="stylesheet" type="text/css"/>
		<script type="text/javascript" src="modules.js"></script>
		<script type="text/javascript" src="js/options.js"></script>
	</head>
	<body id="options">
		<div class="fixed-top">
			<header>
				<img id="sp-icon" src="icon48.png" alt="Seek 'n Play">
				<h1 class="top-title" data-translation="optionsTitle">Seek 'n Play options</h1>
			</header>
		</div>
		
		<div class="options-sections">

			<section>
				<h3 data-translation="playerPositionTitle">Player position</h3>
				<form>
				<span class="controlled-setting-with-label">
					<input type="radio" value="top" id="opt-pp-top" name="opt-playerpos" data-setting="position">
					<label for="opt-pp-top" data-translation="playerPositionTop">Top</label>
				</span>
				<span class="controlled-setting-with-label">
					<input type="radio" value="bottom" id="opt-pp-bottom" name="opt-playerpos" data-setting="position">
					<label for="opt-pp-bottom" data-translation="playerPositionBottom">Bottom</label>
				</span>
			</section>
			<section>
				<h3 data-translation="showWelcomeScreenTitle">Welcome screen</h3>
				<span class="controlled-setting-with-label">
					<input type="checkbox" value="false" id="opt-welcome" data-setting="hide-welcome">
					<label for="opt-welcome" data-translation="showWelcomeScreen">Show welcome screen upon updating</label>
				</span>
				</form>
			</section>
			
		</div>
	</body>
</html>
