<style>

#YTSNP-player-everywhere input[type=range] {
  display: block;
  background: transparent;
  -webkit-appearance: none;
  margin: 10px 0;
  width: 100%;
}

#YTSNP-player-everywhere input[type=range]:focus {
  outline: none;
}

#YTSNP-player-everywhere .video-range-container:hover input[type=range]::-webkit-slider-runnable-track, #YTSNP-player-everywhere .video-range-container:active input[type=range]::-webkit-slider-runnable-track {
  height: 5px;
}

#YTSNP-player-everywhere input[type=range]::-webkit-slider-runnable-track {
  width: 100%;
  height: 2px;
  cursor: pointer;
  transition: all 0.2s;
  /* background: #F12B24; */
  /* background-image: -webkit-gradient(
        linear,
        left top,
        right top,
        color-stop(0.15, #F12B24),
        color-stop(0.15, rgba(255, 255, 255, 0.4))
    ); */
}

#YTSNP-player-everywhere .video-range-container:hover input[type=range]::-webkit-slider-thumb, #YTSNP-player-everywhere input[type=range]:active::-webkit-slider-thumb {
  opacity: 1;
  transform: scale(1);
}

#YTSNP-player-everywhere input[type=range]::-webkit-slider-thumb {
  opacity: 0;
  transform: scale(0);
  box-shadow: 0px 0px 0px #000031;
  border: 0px solid #00001E;
  height: 12px;
  width: 12px;
  border-radius: 50px;
  background: #BF221D;
  cursor: pointer;
  -webkit-appearance: none;
  margin-top: -3.5px;
  transition: all 0.05s;
}

#YTSNP-player-everywhere input[type=range]:hover::-webkit-slider-runnable-track {
 /*   background: -webkit-gradient(
        linear,
        left top,
        right top,
        color-stop(0.15, #F12B24),
        color-stop(0.15, rgba(255, 255, 255, 0.4))
    );  */
}

#YTSNP-player-everywhere:active {
	cursor: move;
}

#YTSNP-player-everywhere {
	position: fixed;
	display: inline-block;
	-webkit-user-drag: none;
	user-drag: none;
}

#YTSNP-player-everywhere .gradient-background {
	bottom: 0;
	height:98px;
	width: 100%;
	background-position: bottom;
	position: absolute;
	background-repeat: repeat-x;
	transition: opacity .25s cubic-bezier(0.0,0.0,0.2,1);
	pointer-events: none;
	background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAADGCAYAAAAT+OqFAAAAdklEQVQoz42QQQ7AIAgEF/T/D+kbq/RWAlnQyyazA4aoAB4FsBSA/bFjuF1EOL7VbrIrBuusmrt4ZZORfb6ehbWdnRHEIiITaEUKa5EJqUakRSaEYBJSCY2dEstQY7AuxahwXFrvZmWl2rh4JZ07z9dLtesfNj5q0FU3A5ObbwAAAABJRU5ErkJggg==);
}

#YTSNP-player-everywhere .video-range-container {
	z-index: 20;
}

</style>

<div id="YTSNP-player-everywhere" draggable="true">
	<img src='http://gravidi.com/img/video/video_box.png' />
	<div class="video-range-container">
	  <input type="range" value="0" max="660" />
	</div>
	<div class="gradient-background"></div>
</div>

<script>
var range = document.querySelector('input[type="range"]');

var updateProgress = function() {
  var ran = range.value / range.max;
  range.style.background = '-webkit-gradient(linear, left top, right top, color-stop(' + ran + ', #F12B24), color-stop(' + ran + ', rgba(255, 255, 255, 0.4)))';
};

range.addEventListener('input', updateProgress);

setInterval(function () { range.value = parseInt(range.value) + 1; updateProgress() }, 500);

var player = document.querySelector("#YTSNP-player-everywhere");
var target = null;
var offset = {};

player.addEventListener('dragstart', function (ev) {
	ev.dataTransfer.setDragImage(player, -999999, -999999);
	offset.x = ev.clientX - player.offsetLeft;
	offset.y = ev.clientY - player.offsetTop;
	target = player;
});

player.addEventListener('dragend', function () {
	target = null;
});

document.addEventListener("dragover", function (ev) {
	if (target) {
		target.style.left = Math.min(Math.max(ev.clientX - offset.x, 0), window.innerWidth - player.clientWidth) + "px";
		target.style.top = Math.min(Math.max(ev.clientY - offset.y, 0), window.innerHeight - player.clientHeight) + "px";
	}
}, false);
</script>
